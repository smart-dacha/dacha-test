<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка GigaChat</title>
    <style>
        body { font-family: sans-serif; padding: 16px; }
        #answer { background: #f0f0f0; padding: 12px; border-radius: 8px; margin-top: 12px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>Тест Дача SOS</h2>
    <button onclick="askAI()">Спросить про ржавую воду</button>
    <div id="answer"></div>
    <script>
        async function askAI() {
            const token = "MDE5ZmE4ZDYtNjMwYS03NWQ3LTg2ODEtYmI1MjNlN2EwOWRiOmI5Zjk5MjdjLWM2MGUtNGM2NC04NTY1LTg1YTYwMDc5ZTEyMA=="; // ← сюда ваш токен
            const answerDiv = document.getElementById("answer");
            answerDiv.textContent = "Думаю...";
            try {
                const response = await fetch("https://gigachat.devices.sberbank.ru/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({
                        model: "GigaChat",
                        messages: [
                            { role: "user", content: "У меня на даче из крана течёт ржавая вода. В чём может быть причина и какой мастер нужен? Ответь кратко, по-русски, без JSON." }
                        ],
                        temperature: 0.7
                    })
                });
                const data = await response.json();
                if (data.choices && data.choices[0]) {
                    answerDiv.textContent = data.choices[0].message.content;
                } else {
                    answerDiv.textContent = "Ошибка: " + JSON.stringify(data);
                }
            } catch (e) {
                answerDiv.textContent = "Ошибка запроса: " + e.message;
            }
        }
    </script>
</body>
</html>
